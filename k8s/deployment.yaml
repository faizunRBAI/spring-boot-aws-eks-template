apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: '%%NAMESPACE%%'
  labels:
    app.kubernetes.io/name: api
spec:
  # __UDAP_APP_REPLICAS__ is substituted once, when the project is created from
  # this blueprint. %%IMAGE%% and %%NAMESPACE%% are substituted by the configure
  # stage on every deploy.
  replicas: __UDAP_APP_REPLICAS__
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current replica count while rolling forward.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: api
      # Give the drain in server.js room to finish before SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # Spread replicas across availability zones so losing one zone cannot
        # take the whole service with it.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: '%%IMAGE%%'
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: '8080'
            - name: APP_VERSION
              value: '%%IMAGE_TAG%%'
            # Spring binds these automatically to spring.datasource.*.
            # Absent means no database module was chosen, and the service starts
            # anyway with its readiness probe reporting "not configured".
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: SPRING_DATASOURCE_URL
                  optional: true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: SPRING_DATASOURCE_USERNAME
                  optional: true
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: SPRING_DATASOURCE_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # Memory is capped because exceeding it is a bug; CPU is not,
              # because throttling a healthy service is worse than bursting.
              memory: 1Gi
          # A JVM takes longer to come up than a Node or Python process, so the
          # startup probe carries the slow first seconds and the liveness probe
          # stays tight afterwards. Without it, liveness kills the pod mid-boot.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
