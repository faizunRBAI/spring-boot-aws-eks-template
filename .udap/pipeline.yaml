version: 1
name: spring-boot-eks
vcs: github

# Delivery pipeline for the Spring Boot on EKS blueprint.
#
# Shape: seven quality and security gates run in parallel and all of them must
# pass before a single AWS resource is touched. Infrastructure comes up, the image
# is built and scanned, migrations run, then the cluster is configured and
# verified.
#
# Every stage that touches the project works with EITHER build tool: the
# `build_tool` module choice decides whether pom.xml or build.gradle.kts lands,
# and each step detects which one it got. Neither wrapper (mvnw/gradlew) is
# shipped, because both need a committed .jar and template repositories are
# binary-free.
#
# Rendered CI files are generated from this spec — never edit
# .github/workflows/* by hand.

stages:
  # ── Gates (parallel, no cloud access) ───────────────────────────────────────

  - id: lint
    kind: lint
    needs: []
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Coding standards
        # Checkstyle, against config/checkstyle/checkstyle.xml. The rule set is
        # deliberately not google_checks — see the comment at the top of that
        # file for why a gate nobody can keep green is worse than no gate.
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then
            mvn -B -ntp checkstyle:check
          else
            GRADLE_VERSION=8.11.1
            curl -fsSL --connect-timeout 10 --max-time 300 --retry 3 -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d /opt
            "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon checkstyleMain checkstyleTest
          fi

  - id: test
    kind: test
    needs: []
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then
            mvn -B -ntp test
          else
            GRADLE_VERSION=8.11.1
            curl -fsSL --connect-timeout 10 --max-time 300 --retry 3 -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d /opt
            "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon test
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            build/reports/tests/**
          retention-days: 14

  - id: sast
    kind: security
    needs: []
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install --quiet "semgrep>=1.90,<2"
      - name: Static application security testing
        # Deliberately NOT --error: the scan always exits 0 so the report is
        # written and uploaded, and the separate gate step below decides. With
        # --error the job died before the artifact existed and before anything
        # readable reached the log, which is the worst possible failure mode for a
        # security gate.
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/java \
            --severity ERROR \
            --sarif --output semgrep.sarif \
            --metrics off \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast
          path: semgrep.sarif
          retention-days: 30
      - name: Fail on SAST findings
        run: |
          COUNT="$(jq '[.runs[]?.results[]?] | length' semgrep.sarif)"
          echo "Semgrep ERROR-severity findings: ${COUNT}"
          if [ "$COUNT" -gt 0 ]; then
            jq -r '.runs[].results[]
                   | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\n  rule: \(.ruleId)\n  \(.message.text | split("\n")[0])\n"' \
              semgrep.sarif
            echo "::error::Semgrep found ${COUNT} blocking finding(s). Fix them, or annotate a genuinely accepted one with '// nosemgrep: <rule-id>' plus the reason."
            exit 1
          fi

  - id: secrets_scan
    kind: security
    needs: []
    steps:
      - name: Install Gitleaks
        # --fail matters: without it curl writes the 404 page to the tarball and
        # the failure surfaces three lines later as an unreadable tar error.
        run: |
          mkdir -p bin
          curl --fail -sSL --connect-timeout 10 --max-time 120 --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          chmod +x bin/gitleaks
          ./bin/gitleaks version
      - name: Secret scanning
        # --exit-code 0 so the report is always written and uploaded; the gate
        # step below is what fails the job. Findings are redacted so the scan
        # itself never becomes the leak.
        run: |
          ./bin/gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 0 \
            --report-format sarif \
            --report-path gitleaks.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30
      - name: Fail on leaked secrets
        run: |
          COUNT="$(jq '[.runs[]?.results[]?] | length' gitleaks.sarif)"
          echo "Gitleaks findings: ${COUNT}"
          if [ "$COUNT" -gt 0 ]; then
            jq -r '.runs[].results[]
                   | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.ruleId)"' \
              gitleaks.sarif
            echo "::error::Gitleaks found ${COUNT} candidate secret(s). Rotate anything real, then reference it as \${{ secrets.NAME }}; add a false positive to the allowlist in .gitleaks.toml."
            exit 1
          fi

  - id: sbom
    kind: security
    needs: []
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate the CycloneDX bill of materials
        # One bill of materials, generated from the resolved dependency graph.
        # The licence gate reads the same document, so the two gates can never
        # disagree about what ships.
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then
            mvn -B -ntp -DskipTests package org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
          else
            GRADLE_VERSION=8.11.1
            curl -fsSL --connect-timeout 10 --max-time 300 --retry 3 -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d /opt
            "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon cyclonedxBom
          fi
          SBOM="$(find . -name 'sbom-source.cdx.json' -not -path './bin/*' | head -1)"
          [ -n "$SBOM" ] || { echo "::error::No CycloneDX document was produced."; exit 1; }
          cp "$SBOM" sbom-source.cdx.json
          python3 -c "import json,sys; d=json.load(open('sbom-source.cdx.json')); print(f\"{d['bomFormat']} {d['specVersion']}: {len(d.get('components', []))} components\")"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-source
          path: sbom-source.cdx.json
          retention-days: 90

  - id: license_scan
    kind: security
    needs: []
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve the dependency licences
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then
            mvn -B -ntp -DskipTests package org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
          else
            GRADLE_VERSION=8.11.1
            curl -fsSL --connect-timeout 10 --max-time 300 --retry 3 -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d /opt
            "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon cyclonedxBom
          fi
          cp "$(find . -name 'sbom-source.cdx.json' -not -path './bin/*' | head -1)" sbom-source.cdx.json
      - name: Licence compliance
        # A REVIEWED allowlist, not a permissive-only one — a stock Spring Boot
        # application cannot satisfy permissive-only and never could:
        #
        #   EPL-1.0 / LGPL          logback, the default logging backend
        #   EPL-2.0 / GPL-2.0-CPE   jakarta.annotation-api. The classpath
        #                           exception exists precisely so that linking
        #                           does not propagate the GPL.
        #   LGPL-2.1                MariaDB Connector/J, JNA. The LGPL's copyleft
        #                           attaches to modifications of the library, not
        #                           to an application using an unmodified copy.
        #   GPL-2.0 + Universal
        #   FOSS Exception          MySQL Connector/J. Worth a lawyer's eye if you
        #                           ever DISTRIBUTE the artefact rather than run it
        #                           as a service; MariaDB Connector/J speaks to
        #                           MySQL too and is the usual way out.
        #   Oracle FUTC             ojdbc11. Free to use with Oracle Database.
        #
        # A component may declare several licences; one allowed licence is enough,
        # which is the correct reading of a dual licence. A licence not on this
        # list is not a failure of the tool — it is a decision somebody has to
        # make and write down here.
        run: |
          set -euo pipefail
          ALLOWED='["Apache-2.0","Apache License, Version 2.0","Apache Software License",
                    "MIT","MIT License","BSD-2-Clause","BSD-3-Clause","BSD License",
                    "ISC","0BSD","Unlicense","CC0-1.0","Public Domain",
                    "EPL-1.0","EPL-2.0","Eclipse Public License - v 1.0",
                    "Eclipse Public License - v 2.0","EDL-1.0",
                    "Eclipse Distribution License - v 1.0",
                    "GPL-2.0-with-classpath-exception",
                    "GNU General Public License, version 2 with the GNU Classpath Exception",
                    "The GNU General Public License, v2 with Universal FOSS Exception, v1.0",
                    "LGPL-2.1","LGPL-2.1-only","LGPL-2.1-or-later","LGPL-3.0","LGPL-3.0-only",
                    "GNU Lesser General Public License",
                    "Oracle Free Use Terms and Conditions (FUTC)"]'

          echo "Components with no licence a human has approved:"
          jq --argjson allowed "$ALLOWED" -r '
            [ .components[]
              | . as $c
              | (($c.licenses // []) | map(.license.id // .license.name // .expression)
                                     | map(select(. != null))) as $names
              | select(($names | length) > 0)
              | select([ $names[] | select(IN($allowed[])) ] | length == 0)
              | "  \($c.name) \($c.version // "") — \($names | join(" OR "))"
            ] | if length == 0 then "  none" else .[] end' sbom-source.cdx.json | tee licence-violations.txt

          echo
          echo "Components declaring no licence at all (reported, not blocking):"
          jq -r '[ .components[] | select((.licenses // []) | length == 0)
                   | "  \(.name) \(.version // "")" ] | if length == 0 then "  none" else .[] end' \
            sbom-source.cdx.json

          jq -r '["component","version","licences"], ( .components[]
                 | [ .name, (.version // ""),
                     (((.licenses // []) | map(.license.id // .license.name // .expression)
                                         | map(select(. != null)) | join(" OR ")) // "") ] )
                 | @csv' sbom-source.cdx.json > licenses.csv

          if ! grep -q "^  none$" licence-violations.txt; then
            echo "::error::A dependency carries a licence nobody has approved. Review it, then add the licence to the allowlist in .udap/pipeline.yaml with the reason — or replace the dependency."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: licenses.csv
          retention-days: 90

  - id: iac_scan
    kind: security
    needs: []
    steps:
      - name: Install Trivy
        # Installed from Aqua's signed apt repository, for two reasons:
        #
        #  1. The upstream `curl … | sh` installer cannot be pinned reliably —
        #     Trivy prunes old GitHub releases, so the script resolves the
        #     version, then 404s on the asset and exits 1. A version that works
        #     today stops installing in a few months.
        #  2. Piping a remote script into a shell is itself an ERROR-severity SAST
        #     finding, so the security gate blocked on its own installer.
        #
        # The apt repository always serves the current release. The key fetch
        # is BOUNDED (--timeout/--tries): wget's defaults retry a hiccuping
        # server almost forever and the job has no timeout-minutes, so a
        # transient flake once held a deploy open for hours on this line. wget
        # and gpg ship on every ubuntu-latest runner; nothing needs installing
        # first.
        run: |
          wget --timeout=30 --tries=3 -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy
          trivy --version
      - name: Terraform security scan
        # Blocking on CRITICAL only, so a newly published rule cannot stop a
        # deploy without a human deciding first. Accepted findings live in
        # .trivyignore with their reasons.
        run: trivy config infra --severity CRITICAL --exit-code 1 --ignorefile .trivyignore
      - name: Terraform security report
        run: trivy config infra --severity HIGH,MEDIUM --exit-code 0 --ignorefile .trivyignore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkov baseline
        # Second opinion with a different rule set, advisory by design: two
        # scanners disagree often enough that only one of them should hold the
        # gate. `|| true` because --soft-fail does not guarantee exit 0 in
        # checkov 3.
        run: |
          pip install --quiet "checkov>=3,<4"
          checkov --directory infra --framework terraform --compact --soft-fail || true

  # ── Infrastructure ──────────────────────────────────────────────────────────

  - id: provision
    kind: provision
    needs: [lint, test, sast, secrets_scan, license_scan, sbom, iac_scan]
    timeout_minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: __UDAP_AWS_REGION__
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    steps:
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
      - name: Terraform apply
        # 60 minutes rather than 45: an Oracle instance and an Aurora cluster both
        # take considerably longer to come up than a Postgres one.
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: build_push
    kind: build_push
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: __UDAP_AWS_REGION__
    steps:
      - name: Resolve image reference
        # Derived from the account, region and project name rather than passed
        # between jobs: a job output containing the project name is dropped by
        # GitHub because that value is a secret.
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${{ secrets.PROJECT_NAME }}:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            .
      - name: Push image
        run: docker push "$IMAGE"

  - id: image_scan
    kind: security
    needs: [build_push]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: __UDAP_AWS_REGION__
    steps:
      - name: Install Trivy
        run: |
          wget --timeout=30 --tries=3 -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy
          trivy --version
      - name: Resolve image reference
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${{ secrets.PROJECT_NAME }}:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Scan the image for vulnerabilities
        # --ignore-unfixed keeps the gate about things you can act on: a base
        # image CVE with no released patch is not a reason to block a deploy. The
        # Dockerfile runs `apk upgrade` and ships a JRE rather than a JDK, so a
        # finding here is normally a real one in your own dependencies. Record a
        # genuinely accepted CVE in .trivyignore with its reason.
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --scanners vuln,secret \
            --ignorefile .trivyignore \
            "$IMAGE"
      - name: Generate CycloneDX SBOM for the image
        run: trivy image --format cyclonedx --output sbom-image.cdx.json "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-image
          path: sbom-image.cdx.json
          retention-days: 90

  # ── Release ─────────────────────────────────────────────────────────────────

  - id: configure
    kind: configure
    needs: [provision, image_scan]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: __UDAP_AWS_REGION__
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    steps:
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Read the database connection details
        # Read here rather than exported as job outputs: GitHub silently drops
        # job outputs whose value contains a secret, and these do.
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          DB_URL="$(terraform output -raw database_jdbc_url 2>/dev/null || true)"
          DB_USER="$(terraform output -raw database_username 2>/dev/null || true)"
          DB_PASS="$(terraform output -raw database_password 2>/dev/null || true)"
          if [ -n "$DB_PASS" ]; then echo "::add-mask::${DB_PASS}"; fi
          if [ -z "$DB_URL" ]; then
            echo "No database in this configuration — the service will run stateless."
          fi
          {
            echo "DB_URL=${DB_URL}"
            echo "DB_USER=${DB_USER}"
            echo "DB_PASS=${DB_PASS}"
          } >> "$GITHUB_ENV"
      - name: Configure cluster access
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.PROJECT_NAME }}-eks" \
            --region "$AWS_REGION"
      - name: Install the metrics server
        # Supplies the CPU metrics the HorizontalPodAutoscaler scales on.
        run: |
          kubectl apply -f \
            https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
      - name: Bootstrap namespace, secret and service account
        run: |
          set -euo pipefail
          NAMESPACE="${{ secrets.PROJECT_NAME }}"
          IMAGE_TAG="${GITHUB_SHA::12}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "NAMESPACE=${NAMESPACE}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${NAMESPACE}:${IMAGE_TAG}" >> "$GITHUB_ENV"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "${DB_URL:-}" ]; then
            # Written to a private file and read with --from-env-file rather than
            # passed as --from-literal: a value on the command line is visible in
            # the process list to anything else on the runner, and a literal
            # password argument is indistinguishable from a hardcoded one to the
            # platform's own secret scanner, which refuses to ship the project.
            umask 077
            {
              echo "SPRING_DATASOURCE_URL=${DB_URL}"
              echo "SPRING_DATASOURCE_USERNAME=${DB_USER}"
              echo "SPRING_DATASOURCE_PASSWORD=${DB_PASS}"
            } > /tmp/app-database.env
            kubectl create secret generic app-database \
              --namespace "$NAMESPACE" \
              --from-env-file=/tmp/app-database.env \
              --dry-run=client -o yaml | kubectl apply -f -
            rm -f /tmp/app-database.env
          else
            kubectl delete secret app-database --namespace "$NAMESPACE" --ignore-not-found
          fi

          # The migration Job runs before the Deployment, so the service account
          # it references has to exist first.
          sed -e "s|%%NAMESPACE%%|${NAMESPACE}|g" k8s/serviceaccount.yaml | kubectl apply -f -

      - name: Run database migrations
        # In-cluster, on the image just built, before the new Deployment is
        # applied — the schema is ready before any new pod serves traffic, and a
        # failed migration stops the deploy instead of half-releasing it.
        #
        # The wait is a poll, deliberately, not
        # `kubectl wait --for=condition=complete`: that flag watches only the
        # success condition, so a Job that fails in two seconds still burns the
        # entire timeout and then reports "timed out waiting for the condition"
        # while the real error sits in a pod log nobody printed. This checks both
        # outcomes and prints the migration log either way.
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "No database in this configuration — nothing to migrate."
            exit 0
          fi

          kubectl delete job db-migrate -n "$NAMESPACE" --ignore-not-found --wait=true
          sed -e "s|%%NAMESPACE%%|${NAMESPACE}|g" \
              -e "s|%%IMAGE%%|${IMAGE}|g" \
              k8s/db-migrate-job.yaml | kubectl apply -f -

          # 600s rather than 300s: a JVM start plus Flyway on a cold Aurora
          # cluster is slower than a scripting-language migration runner.
          DEADLINE=$((SECONDS + 600))
          OUTCOME="pending"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            SUCCEEDED="$(kubectl get job db-migrate -n "$NAMESPACE" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
            FAILED="$(kubectl get job db-migrate -n "$NAMESPACE" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
            if [ "${SUCCEEDED:-}" = "1" ]; then OUTCOME="succeeded"; break; fi
            if [ -n "${FAILED:-}" ] && [ "${FAILED}" != "0" ]; then OUTCOME="failed"; break; fi
            sleep 5
          done

          echo "--- migration log ---"
          kubectl logs job/db-migrate -n "$NAMESPACE" --tail=200 || echo "(no pod log available)"

          if [ "$OUTCOME" != "succeeded" ]; then
            [ "$OUTCOME" = "pending" ] && OUTCOME="did not finish within 600s"
            echo "--- job and pod state ---"
            kubectl describe job db-migrate -n "$NAMESPACE" || true
            kubectl get pods -n "$NAMESPACE" -l job-name=db-migrate -o wide || true
            kubectl describe pods -n "$NAMESPACE" -l job-name=db-migrate || true
            echo "::error::Database migration ${OUTCOME}. The migration log and pod state are above; nothing was deployed."
            exit 1
          fi
          echo "Schema is up to date."

      - name: Apply Kubernetes manifests
        run: |
          set -euo pipefail
          for manifest in k8s/*.yaml; do
            # The migration Job was applied by the previous step; re-applying it
            # here would start a second run of it.
            case "$(basename "$manifest")" in
              db-migrate-job.yaml) continue ;;
            esac
            sed -e "s|%%NAMESPACE%%|${NAMESPACE}|g" \
                -e "s|%%IMAGE_TAG%%|${IMAGE_TAG}|g" \
                -e "s|%%IMAGE%%|${IMAGE}|g" \
                "$manifest" | kubectl apply -f -
          done
      - name: Wait for the rollout
        # `kubectl rollout status` says only "error: timed out waiting for the
        # condition" when pods never become ready, and the reason — a failing
        # readiness probe, an unreachable database, an image that will not pull —
        # is only visible in state this step has to go and fetch.
        run: |
          set -uo pipefail
          NS="${{ secrets.PROJECT_NAME }}"
          if kubectl rollout status deployment/api --namespace "$NS" --timeout=10m; then
            exit 0
          fi
          echo "--- pods ---"
          kubectl get pods -n "$NS" -l app.kubernetes.io/name=api -o wide || true
          echo "--- why the pods are not ready ---"
          kubectl describe pods -n "$NS" -l app.kubernetes.io/name=api \
            | grep -A 12 -E "Conditions:|Events:|State:|Last State:" || true
          echo "--- application log ---"
          kubectl logs -n "$NS" -l app.kubernetes.io/name=api --tail=100 --all-containers || true
          echo "--- namespace events ---"
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -25 || true
          echo "::error::The Deployment never became ready. A pod that answers /health but fails /ready is usually the database connection — check the application log above."
          exit 1

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: __UDAP_AWS_REGION__
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Wait for the load balancer
        run: |
          set -euo pipefail
          NAMESPACE="${{ secrets.PROJECT_NAME }}"
          aws eks update-kubeconfig --name "${NAMESPACE}-eks" --region "$AWS_REGION"
          HOST=""
          for _ in $(seq 1 40); do
            # A network load balancer reports a hostname; an IP-target load
            # balancer reports .ip. Read both, or the wait times out on a service
            # that is actually ready.
            HOST="$(kubectl get svc api -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -z "$HOST" ]; then
              HOST="$(kubectl get svc api -n "$NAMESPACE" \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            fi
            if [ -n "$HOST" ]; then break; fi
            sleep 15
          done
          if [ -z "$HOST" ]; then
            echo "The load balancer never reported an address after 10 minutes."
            echo "--- service ---"
            kubectl describe svc api -n "$NAMESPACE" || true
            echo "--- events (the cloud controller reports subnet and quota problems here) ---"
            kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -25 || true
            echo "::error::No load balancer address. Usual causes: the public subnets lost their kubernetes.io/role/elb tag, or the account is at its load balancer quota."
            exit 1
          fi
          echo "APP_URL=http://${HOST}" >> "$GITHUB_ENV"
          # The platform learns a project's public address by scraping these exact
          # shapes out of the CI log — there is no API call for it — and it only
          # shows the "open the app" link once it has one.
          echo "Load balancer address: ${HOST}"
          echo "alb_hostname = \"${HOST}\""
          echo "Live URL: http://${HOST}"
          echo "Application is available at: http://${HOST}"
          echo "url=http://${HOST}"
      - name: Health check
        # A brand-new load balancer is not resolvable the moment Kubernetes
        # reports its name: DNS has to publish and the targets have to pass their
        # first health check. The first attempts failing is the normal shape of
        # this wait, so the loop reports progress itself instead of printing a wall
        # of raw curl errors that read like a broken deploy.
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${APP_URL}/health" 2>/dev/null || true)"
            if [ "$CODE" = "200" ]; then
              echo "Service is healthy at ${APP_URL}"
              echo "Live URL: ${APP_URL}"
              curl -s --max-time 10 "${APP_URL}/api/info" || true
              echo
              exit 0
            fi
            case "${CODE}" in
              000|"") echo "  attempt ${i}/40: load balancer not answering yet (DNS or target registration)" ;;
              *)      echo "  attempt ${i}/40: HTTP ${CODE} from /health" ;;
            esac
            sleep 15
          done
          echo "The service never returned 200 from /health in 10 minutes."
          echo "--- pods ---"
          kubectl get pods -n "${{ secrets.PROJECT_NAME }}" -o wide || true
          echo "--- application log ---"
          kubectl logs -n "${{ secrets.PROJECT_NAME }}" -l app.kubernetes.io/name=api --tail=100 || true
          echo "--- endpoints (empty means no pod passed its readiness probe) ---"
          kubectl get endpoints api -n "${{ secrets.PROJECT_NAME }}" -o wide || true
          echo "::error::The load balancer answered but /health never returned 200. Check the application log above, and whether the readiness probe on /ready is passing."
          exit 1

  - id: notify
    kind: notify
    needs: [verify]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: __UDAP_AWS_REGION__
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Deployment summary
        # The address is re-read here rather than passed from verify: a job output
        # is the only way to carry it between jobs, and GitHub silently drops any
        # job output whose value contains a secret.
        run: |
          set -uo pipefail
          NS="${{ secrets.PROJECT_NAME }}"
          aws eks update-kubeconfig --name "${NS}-eks" --region "$AWS_REGION" >/dev/null 2>&1 || true
          HOST="$(kubectl get svc api -n "$NS" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
          [ -n "$HOST" ] || HOST="$(kubectl get svc api -n "$NS" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
          {
            echo "### Deployment complete"
            echo ""
            if [ -n "$HOST" ]; then
              echo "**Application:** <http://${HOST}>"
              echo ""
              echo "> A newly created load balancer can take a few more minutes to"
              echo "> resolve from outside AWS. If the link does not open yet, it is"
              echo "> DNS propagation, not the deploy — the health check above"
              echo "> already reached it."
              echo ""
            fi
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster | \`${NS}-eks\` |"
            echo "| Namespace | \`${NS}\` |"
            echo "| Image tag | \`${GITHUB_SHA::12}\` |"
            echo "| Actuator | \`http://${HOST}/actuator/health\` |"
            echo ""
            echo "Re-read the address any time with:"
            echo '```'
            echo "aws eks update-kubeconfig --name ${NS}-eks --region ${AWS_REGION}"
            echo "kubectl get svc api -n ${NS}"
            echo '```'
            echo ""
            echo "Security artefacts for this run: Semgrep SAST, Gitleaks, licence report,"
            echo "dependency SBOM and image SBOM are attached to the workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$HOST" ] && echo "Live URL: http://${HOST}"
          exit 0

rollback:
  strategy: manual

# Teardown override. The default rendered destroy runs terraform alone, which
# cannot work here: the load balancer is created by Kubernetes, not terraform, and
# while it exists its security group and network interfaces hold the subnets, so
# `terraform destroy` fails on DependencyViolation.
destroy:
  steps:
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Read the VPC id from state
      # Terraform runs first, before any deletion, purely to learn the VPC id —
      # the only reliable way to tell "the load balancer this project created"
      # from every other load balancer in the account. Kubernetes names it, not
      # Terraform, so there is no tag or name pattern to match on.
      working-directory: infra
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=${AWS_REGION}"
        echo "VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || true)" >> "$GITHUB_ENV"
    - name: Delete the Kubernetes load balancer
      run: |
        NAMESPACE="${{ secrets.PROJECT_NAME }}"
        if ! aws eks update-kubeconfig --name "${NAMESPACE}-eks" --region "$AWS_REGION" 2>/dev/null; then
          echo "Cluster is already gone — nothing to clean up in Kubernetes."
          exit 0
        fi
        kubectl delete svc --all -n "$NAMESPACE" --ignore-not-found --timeout=5m || true
        kubectl delete namespace "$NAMESPACE" --ignore-not-found --timeout=5m || true

        if [ -z "${VPC_ID:-}" ]; then
          echo "No vpc_id in state — falling back to a fixed wait."
          sleep 180
          exit 0
        fi

        echo "Waiting for AWS to finish deleting load balancers in ${VPC_ID}."
        for _ in $(seq 1 40); do
          V2="$(aws elbv2 describe-load-balancers \
                 --query "length(LoadBalancers[?VpcId=='${VPC_ID}'])" --output text 2>/dev/null || echo 0)"
          V1="$(aws elb describe-load-balancers \
                 --query "length(LoadBalancerDescriptions[?VPCId=='${VPC_ID}'])" --output text 2>/dev/null || echo 0)"
          echo "  load balancers remaining: elbv2=${V2} classic=${V1}"
          if [ "$V2" = "0" ] && [ "$V1" = "0" ]; then
            echo "All load balancers deleted."
            # The network interfaces outlive the load balancer by a few seconds.
            sleep 30
            exit 0
          fi
          sleep 15
        done
        echo "::warning::Load balancers still present after 10 minutes; attempting the destroy anyway."
    - name: Terraform destroy
      working-directory: infra
      # Retried once: a lingering network interface produces a DependencyViolation
      # that clears itself within a minute, and a second attempt is cheaper than a
      # half-destroyed stack somebody has to finish by hand.
      run: |
        # No -e: the first attempt is allowed to fail so the retry can run.
        # init already happened in the VPC-id step, in this same directory.
        set -uo pipefail
        if terraform destroy -input=false -auto-approve; then
          echo "Destroy complete."
          exit 0
        fi
        echo "::warning::First destroy attempt failed — waiting 90s for dependent resources to clear, then retrying."
        sleep 90
        terraform destroy -input=false -auto-approve
